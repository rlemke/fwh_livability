[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-livability"
version = "0.1.0"
description = "Facetwork domain: equal-weight county livability composite (ACS + CDC PLACES + FEMA NRI + EPA AQI) -> national choropleth + rankings"
requires-python = ">=3.11"
dependencies = ["requests", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.8.0"]

[project.entry-points."facetwork.domains"]
livability = "livability:domain"

[tool.setuptools.packages.find]
where = ["src"]
